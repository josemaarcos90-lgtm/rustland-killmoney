    - "&6&l✦ AIRDROP %color%&l%tier% &6&lCAIU!"
    - "&7Coordenadas: &fX: %x%  Y: %y%  Z: %z%"
    - "&7Some em &f%minutes% minutos&7. Corra!"
    - "&8&m-------------------------------"
  title: "&6&lAIRDROP %color%&l%tier%"
  subtitle: "&fX: %x%  Y: %y%  Z: %z%"
  opened: "&e%player% &7abriu o airdrop %color%%tier%&7!"
  ended-empty: "&7O airdrop %color%%tier% &7foi esvaziado."
  ended-time: "&7O airdrop %color%%tier% &7sumiu."
  none: "&7Nenhum airdrop ativo agora. Proximo: &f%next%"
  active: "&6Airdrop %color%%tier% &6em &fX: %x% Y: %y% Z: %z% &7(%time% restantes)"
  status-incoming: "&cAirdrop %color%%tier% &ccomprado por &f%buyer% &ccai em &fX: %x% Y: %y% Z: %z% &7(em %time%)"
  bought:
    - "&8&m-------------------------------"
    - "&c&l☄ AIRDROP COMPRADO!"
    - "&f%buyer% &7comprou um airdrop %color%&l%tier%&7!"
    - "&7Cai em &c%minutes% minutos &7em &fX: %x%  Y: %y%  Z: %z%"
    - "&8&m-------------------------------"
  bought-title: "&c&l☄ AIRDROP %color%&l%tier%"
  bought-subtitle: "&f%buyer% &7- &fX: %x%  Y: %y%  Z: %z%"
  warn-1min:
    - "&c&l⚠ &cO airdrop %color%%tier% &ccai em &f1 minuto &cem &fX: %x%  Y: %y%  Z: %z%"
  landing-failed: "&cO airdrop comprado por &f%buyer% &cnao conseguiu cair e o dinheiro foi devolvido."
  refunded: "&aO airdrop foi cancelado e &f$%price% &afoi devolvido."
  buy-confirm: "&eClique de novo para confirmar: airdrop %color%%tier% &epor &a$%price%&e."
  buy-disabled: "&cA compra de airdrops esta desativada."
  buy-unavailable: "&cEssa raridade nao esta a venda."
  buy-busy: "&cJa existe um airdrop ativo ou a caminho. Espere ele acabar."
  buy-wrong-world: "&cVoce so pode comprar airdrop no mundo principal."
  buy-no-economy: "&cA economia do servidor nao esta disponivel agora."
  buy-no-money: "&cVoce precisa de &f$%price% &cpara comprar esse airdrop."
  buy-no-spot: "&cNao ha um lugar livre aqui para o airdrop cair. Va para um terreno aberto."
