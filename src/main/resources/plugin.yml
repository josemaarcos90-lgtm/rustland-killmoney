name: RustlandKillMoney
version: '1.4.0'
main: br.rustland.killmoney.KillMoneyPlugin
api-version: '1.21'
description: Dinheiro por kill com valor decrescente no mesmo jogador, sem pagar kill dentro do mesmo clan
softdepend: [zMClans, Essentials, Vault, PlaceholderAPI]

commands:
  killmoney:
    description: Comando do RustlandKillMoney
    usage: /killmoney reload
  daily:
    description: Recompensa diaria de 7 dias
    usage: /daily [claim]
    aliases: [diario, recompensa]
  airdrop:
    description: Air drops (status, compra e admin)
    usage: /airdrop [buy [raridade]|spawn [raridade]|end|reload]
    aliases: [ad]
  kit:
    description: Kit inicial de PvP
    usage: /kit
    aliases: [kitpvp, kitinicial]

permissions:
  killmoney.admin:
    default: op
